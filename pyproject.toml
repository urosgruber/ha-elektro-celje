[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv", ".superpowers", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::aiohttp.web_exceptions.NotAppKeyWarning",
]
